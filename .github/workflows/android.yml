name: Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Receiver
    runs-on: ubuntu-latest
    env:
      RECEIVER_RELEASE_KEYSTORE_BASE64: ${{ secrets.RECEIVER_RELEASE_KEYSTORE_BASE64 }}
      RECEIVER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RECEIVER_RELEASE_KEYSTORE_PASSWORD }}
      RECEIVER_RELEASE_KEY_ALIAS: ${{ secrets.RECEIVER_RELEASE_KEY_ALIAS }}
      RECEIVER_RELEASE_KEY_PASSWORD: ${{ secrets.RECEIVER_RELEASE_KEY_PASSWORD }}
      RECEIVER_RELEASE_KEYSTORE_TYPE: ${{ secrets.RECEIVER_RELEASE_KEYSTORE_TYPE }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK paths
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android native toolchain
        run: |
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        if: env.RECEIVER_RELEASE_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          echo "$RECEIVER_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/receiver-release.p12
          {
            echo "storeFile=keystore/receiver-release.p12"
            echo "storePassword=$RECEIVER_RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=$RECEIVER_RELEASE_KEY_ALIAS"
            echo "keyPassword=$RECEIVER_RELEASE_KEY_PASSWORD"
            echo "storeType=${RECEIVER_RELEASE_KEYSTORE_TYPE:-pkcs12}"
          } > signing.properties

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Package APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Receiver-release.apk

      - name: Upload ordinary CI APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: Receiver-release-apk
          path: dist/Receiver-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish durable tagged APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Receiver $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/Receiver-release.apk --clobber

      - name: Keep at most 10 asset-backed Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const published = releases
              .filter((release) => !release.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const retained = published.slice(0, 10);
            if (retained.some((release) => !release.assets?.length)) {
              core.warning('A retained Release has no durable assets; skipping Release pruning.');
              return;
            }
            for (const release of published.slice(10)) {
              core.info(`Deleting old Release ${release.tag_name} (${release.id}).`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              if (!release.tag_name) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
